name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run check && npm test && npm run build
        working-directory: web
      # Keep the initial load small (SPEC §4.1: < 60 KB gzip for the JS + CSS that index.html
      # loads; pages and sheets loaded later on demand don't count).
      - name: Bundle size
        working-directory: web
        run: ../scripts/initial-size.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  rust:
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Generated TypeScript types must be committed.
      - run: git diff --exit-code web/src/lib/api/types

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t shoppingcart:ci .
      - run: |
          size=$(docker image inspect shoppingcart:ci --format '{{.Size}}')
          echo "image: $((size / 1024 / 1024)) MB"

  # Every push to main that passes the checks publishes an image for amd64 and arm64 to GHCR as
  # `edge` and `sha-<commit>`. Releases (`latest`, versions) come from the Release workflow.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/shoppingcart
          tags: |
            type=raw,value=edge
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
